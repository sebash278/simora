services:
  mysql:
    image: mysql:8.0
    container_name: simora-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: simora_root_2026
      MYSQL_DATABASE: simora_db
      MYSQL_USER: simora_user
      MYSQL_PASSWORD: simora_password_2026
    ports:
      - "3306:3306"
    volumes:
      - simora_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "simora_user", "-psimora_password_2026"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  simora_mysql_data:
